{{/* This is index/home page */}}


{{ define "main" }}
<h1>{{ .Title }}</h1>
<div>{{ .Content }}</div>

<section>
  <h2>Posts</h2>
  <ul>
    {{ range where .Site.RegularPages "Section" "posts" }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time>{{ .Date.Format "2006-01-02" }}</time>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
